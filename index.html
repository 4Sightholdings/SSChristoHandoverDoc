<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4Sight Marketing Handover</title><style>
:root{--deep:#071e55;--navy:#143074;--blue:#2b6eb4;--cyan:#026999;--sky:#179ec7;--ice:#69c1ed;--red:#cd202a;--line:#c9dce8}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f4faff;color:var(--deep)}header{height:88px;position:sticky;top:0;z-index:20;display:flex;justify-content:center;align-items:center;padding:12px 24px;background:linear-gradient(100deg,var(--navy),var(--blue) 28%,var(--ice) 58%,#eef8fd 78%,#fff);box-shadow:0 10px 35px #071e5524}.actions{width:100%;display:flex;justify-content:center;align-items:center;gap:16px}.pill,.btn{border-radius:999px;padding:11px 18px;font-weight:800}.pill{border:1px solid;font-size:12px;background:#ffffffd9}.pill:before{content:'●';margin-right:8px}.unverified{color:#65727c}.local{color:#765608;background:#fff1c7}.checking{color:#026999;background:#d8f4ff}.success{color:#075967;background:#d7f6eb}.error{color:#9d1720;background:#ffe2e4}.btn{position:relative;overflow:hidden;border:1px solid #14307422;background:#fff;color:var(--navy);cursor:pointer;transition:.28s;box-shadow:0 8px 20px #071e5514}.btn:hover{transform:translateY(-3px) scale(1.03)}.primary{color:#fff;border:0;background:linear-gradient(135deg,var(--navy),var(--cyan),var(--sky))}.hero{min-height:610px;padding:90px 8vw;display:grid;grid-template-columns:1.3fr .7fr;gap:50px;align-items:center;color:#fff;background:linear-gradient(135deg,#000,var(--deep),var(--navy));position:relative;overflow:hidden}.hero-copy,.panel{position:relative;z-index:2}.eyebrow{color:var(--ice);letter-spacing:4px;font-size:12px;font-weight:900}.hero h1{font-size:clamp(48px,7vw,96px);letter-spacing:-5px;line-height:.95;margin:18px 0}.hero p{font-size:21px;color:#dbeaf4;line-height:1.6;max-width:720px}.panel{padding:28px;border:1px solid #69c1ed55;border-radius:28px;background:#ffffff0b;backdrop-filter:blur(12px);animation:float 5s ease-in-out infinite}.panel strong{display:block;font-size:60px;color:var(--ice)}.hero-watermark{position:absolute;right:-20px;bottom:-135px;z-index:0;display:flex;align-items:baseline;font-size:310px;font-weight:900;line-height:1;letter-spacing:-22px;pointer-events:none}.hero-four{color:#ffffff12}.hero-ai{color:#cd202a92}.ai{color:var(--red)}.tools{max-width:1450px;margin:auto;padding:40px 6vw 18px;display:flex;justify-content:space-between;gap:20px}.tools input{width:min(680px,100%);padding:16px;border:1px solid var(--line);border-radius:14px;font:inherit}.grid{max-width:1450px;margin:auto;padding:10px 6vw 80px;display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:25px;box-shadow:0 10px 30px #071e550d;transition:.35s;animation:rise .55s both}.card:hover{transform:translateY(-9px);box-shadow:0 25px 60px #071e5523}.row{display:flex;justify-content:space-between}.num{display:grid;place-content:center;width:45px;height:45px;border-radius:14px;color:#fff;background:linear-gradient(135deg,var(--navy),var(--blue));font-weight:900}.card p{line-height:1.7;color:#435970}.card a{display:inline-block;text-decoration:none;margin-top:10px}.edit{display:none}.editing .edit{display:inline-block}dialog{border:0;border-radius:22px;width:min(700px,92vw);padding:0;box-shadow:0 35px 120px #0008}dialog::backdrop{background:#000a}.modal{padding:28px;display:grid;gap:15px}.modal input,.modal textarea{width:100%;padding:12px;border:1px solid #b6bfc4;border-radius:10px;font:inherit}.end{display:flex;justify-content:flex-end;gap:10px}.status{min-height:22px;font-size:13px}footer{padding:35px;text-align:center;background:#fff}@keyframes float{50%{transform:translateY(-12px)}}@keyframes rise{from{opacity:0;transform:translateY(24px)}}@media(max-width:900px){.hero{grid-template-columns:1fr}.panel{display:none}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){header{height:auto}.actions{gap:8px;flex-wrap:wrap}.pill,.btn{padding:9px 12px;font-size:12px}.hero{padding:70px 24px}.hero-watermark{right:-35px;bottom:-70px;font-size:190px}.grid{grid-template-columns:1fr;padding:0 18px 60px}.tools{padding:30px 18px;flex-direction:column}}
</style></head><body><header><div class="actions"><span id="pill" class="pill unverified">GitHub sync not verified</span><button id="editMode" class="btn">✎ Edit content</button><button id="github" class="btn primary">↥ Save to GitHub</button></div></header><section class="hero"><div class="hero-watermark"><span class="hero-four">4</span><span class="hero-ai">AI</span></div><div class="hero-copy"><span class="eyebrow">MARKETING COORDINATOR PLAYBOOK</span><h1 id="title"></h1><p id="welcome"></p><small>Prepared by Christo Jansen Van Vuuren • Co-Ordinator: Marketing</small></div><div class="panel">One smart handover.<strong id="heroCount"></strong>essential role sections, searchable and editable.</div></section><section class="tools"><input id="search" type="search" name="handover-search" placeholder="Search Umbraco, Acumatica, events…" value="" autocomplete="off" autocapitalize="off" spellcheck="false"><span id="count"></span></section><main id="grid" class="grid"></main><footer>4Sight Marketing Coordinator Handover</footer><dialog id="editor"><div class="modal"><h2>Edit section</h2><input id="idx" type="hidden"><input id="et"><textarea id="eb" rows="9"></textarea><div class="end"><button class="btn" onclick="editor.close()">Cancel</button><button id="save" class="btn primary">Save draft</button></div></div></dialog><dialog id="gh"><div class="modal"><h2>Connect and save to GitHub</h2><input id="owner" value="4Sightholdings"><input id="repo" placeholder="Repository name"><input id="branch" value="main"><input id="token" type="password" placeholder="GitHub token"><input id="message" value="Update handover content"><div id="status" class="status"></div><div class="end"><button class="btn" onclick="gh.close()">Cancel</button><button id="test" class="btn">Test connection</button><button id="publish" class="btn primary">Commit index.html</button></div></div></dialog><script id="appData" type="application/json">{"title":"Marketing Coordinator Handover","welcome":"Everything needed to take over the role with confidence, in one organised and editable place.","sections":[{"title":"Role Overview","body":"Supports website management, marketing operations, events, inventory, supplier coordination, finance administration and internal communications."},{"title":"Website Management","body":"Manage Umbraco CMS, blogs, white papers, case studies, videos, press releases, SEO fields, ISV pages and Dynamic Grid components. Remember to request a VPN from internal IT for access to the website backend when working from home."},{"title":"Marketing Inventory","body":"Maintain the stock dashboard, conduct stock counts, and track branded items and gifts.","link":{"label":"4Sight Marketing Inventory Dashboard","url":"https://4sightholdings.github.io/SS-Marketing-Inventory/"}},{"title":"Click Tracking Report","body":"Pull data from Rocketseed and use the dashboard to populate a report that can be shared with the leads.","link":{"label":"Click Track Reporting | 4Sight Holdings","url":"https://4sightholdings.github.io/SS-Clicktrack-Reporting/"}},{"title":"Events & Marketing Collateral","body":"Coordinate registrations, branding items, attendee packs, signage and post-event reconciliations. Complete printing well ahead of time and follow up on designs as much as possible. LLMs can help populate name tags, but always double-check every name and company. Create four examples first, then provide the remainder to an LLM."},{"title":"Finance Administration","body":"Manage POs, invoices, supplier documentation and monthly credit card reconciliations. Learn Acumatica, PO (Purchase Order), PR (Purchase Receipt) and Projects. Do not overthink the process. Always double-check invoices for the correct entity and details."},{"title":"Internal Communications","body":"Support newsletters, marketing emails, campaigns and company announcements."},{"title":"Software & Systems","body":"Umbraco CMS, Microsoft 365, SharePoint, Teams, Outlook, Canva and Adobe Acrobat."},{"title":"Key Contacts","body":"Jacqui Scorgie (Marketing Manager), Caroline Barnard and Venique Botes (Designers). Obtain application access securely from Jacqui or the Designers. For Acumatica, speak to Elmarie Pieterse if still applicable."},{"title":"Outstanding Projects","body":"Document current website, campaign, event and finance activities before departure."},{"title":"Recommendations","body":"Check website links regularly, keep inventory updated, maintain organised SharePoint folders and monitor finance deadlines."},{"title":"Secure Access Handover","body":"Phone, laptop and application credentials are intentionally not stored in this GitHub Pages app. Transfer the SIM PIN, PUK, phone PIN, laptop PIN and application passwords through the company-approved secure password or IT process."}]}</script><script>let data=JSON.parse(document.querySelector('#appData').textContent),editing=false;const $=s=>document.querySelector(s),CFG='handoverGithubConfig',TOKEN='handoverGithubToken',DRAFT='handoverDraftV3',LAST='handoverLastSync';function pill(c,t){$('#pill').className='pill '+c;$('#pill').textContent=t}let draft=localStorage.getItem(DRAFT);if(draft){try{data=JSON.parse(draft);pill('local','Draft stored locally')}catch(e){localStorage.removeItem(DRAFT)}}function esc(s=''){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function ai(s){return esc(s).replace(/\bAI\b/gi,m=>`<span class="ai">${m}</span>`)}function render(q=''){$('#title').innerHTML=ai(data.title);$('#welcome').innerHTML=ai(data.welcome);$('#heroCount').textContent=data.sections.length;let a=data.sections.filter(x=>JSON.stringify(x).toLowerCase().includes(q.toLowerCase()));$('#count').textContent=a.length+' sections';$('#grid').innerHTML=a.map((x,i)=>`<article class="card"><div class="row"><span class="num">${String(i+1).padStart(2,'0')}</span><button class="btn edit" onclick="openEdit(${data.sections.indexOf(x)})">Edit</button></div><h2>${ai(x.title)}</h2><p>${ai(x.body)}</p>${x.link?`<a class="btn primary" target="_blank" rel="noopener" href="${esc(x.link.url)}">${ai(x.link.label)} ↗</a>`:''}</article>`).join('')}function openEdit(i){let x=data.sections[i];$('#idx').value=i;$('#et').value=x.title;$('#eb').value=x.body;$('#editor').showModal()}$('#save').onclick=()=>{let x=data.sections[+$('#idx').value];x.title=$('#et').value.trim();x.body=$('#eb').value.trim();localStorage.setItem(DRAFT,JSON.stringify(data));pill('local','Draft stored locally');render($('#search').value);$('#editor').close()};$('#editMode').onclick=()=>{editing=!editing;document.body.classList.toggle('editing',editing)};$('#search').oninput=e=>render(e.target.value);function config(){return{owner:$('#owner').value.trim(),repo:$('#repo').value.trim(),branch:$('#branch').value.trim()||'main',token:$('#token').value.trim()}}function hdr(t){return{Authorization:'Bearer '+t,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}}function loadCfg(){let c=JSON.parse(localStorage.getItem(CFG)||'{}');$('#owner').value=c.owner||'4Sightholdings';$('#repo').value=c.repo||'';$('#branch').value=c.branch||'main';$('#token').value=localStorage.getItem(TOKEN)||''}function saveCfg(c){localStorage.setItem(CFG,JSON.stringify({owner:c.owner,repo:c.repo,branch:c.branch}));localStorage.setItem(TOKEN,c.token)}$('#github').onclick=()=>{loadCfg();$('#gh').showModal()};$('#test').onclick=async()=>{try{let c=config();if(!c.owner||!c.repo||!c.token)throw Error('Complete all fields.');pill('checking','Checking GitHub…');let r=await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/index.html?ref=${encodeURIComponent(c.branch)}&t=${Date.now()}`,{headers:hdr(c.token)});if(!r.ok)throw Error((await r.json()).message||'Connection failed');saveCfg(c);pill('success','GitHub connection verified');$('#status').textContent='Connection verified.'}catch(e){pill('error','GitHub connection failed');$('#status').textContent=e.message}};function b64(s){return btoa(unescape(encodeURIComponent(s)))}function snapshot(){let c=document.documentElement.cloneNode(true);c.querySelector('#grid').innerHTML='';c.querySelector('#appData').textContent=JSON.stringify(data).replace(/<\//g,'<\\/');c.querySelector('#pill').className='pill unverified';c.querySelector('#pill').textContent='GitHub sync not verified';c.querySelector('#search').value='';return '<!doctype html>\n'+c.outerHTML}async function commit(retry=false){let c=config();saveCfg(c);pill('checking','Updating GitHub…');let url=`https://api.github.com/repos/${c.owner}/${c.repo}/contents/index.html`;let g=await fetch(url+`?ref=${encodeURIComponent(c.branch)}&t=${Date.now()}`,{headers:hdr(c.token)});if(!g.ok)throw Error((await g.json()).message||'Could not read file');let meta=await g.json();let r=await fetch(url,{method:'PUT',headers:{...hdr(c.token),'Content-Type':'application/json'},body:JSON.stringify({message:$('#message').value||'Update handover content',content:b64(snapshot()),sha:meta.sha,branch:c.branch})});if(!r.ok){let e=await r.json();if(!retry&&(r.status===409||r.status===422))return commit(true);throw Error(e.message||'Update failed')}localStorage.removeItem(DRAFT);let stamp=new Date().toLocaleString('en-ZA');localStorage.setItem(LAST,stamp);pill('success','GitHub updated successfully');$('#status').textContent='Committed successfully at '+stamp}$('#publish').onclick=async()=>{try{let c=config();if(!c.owner||!c.repo||!c.token)throw Error('Complete all fields.');await commit()}catch(e){pill('error','GitHub update failed');$('#status').textContent=e.message}};function clearRestoredSearch(){let s=$('#search');s.value='';s.defaultValue='';render('');requestAnimationFrame(()=>{s.value='';render('')});setTimeout(()=>{s.value='';render('')},120)}window.addEventListener('pageshow',clearRestoredSearch);document.addEventListener('DOMContentLoaded',clearRestoredSearch);clearRestoredSearch();</script></body></html>
